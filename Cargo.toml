[workspace]
members = [
  "crates/hush-core",
  "crates/hush-relay",
  "crates/hush-cli",
  "crates/hush-daemon",
  "crates/hush-wallet",
  "crates/hush-atproto",
  "crates/hush-audio",
  "crates/hush-voice",
  "crates/hush-verify",
  "crates/voice-spike",
  "apps/hush-tauri/src-tauri",
]
resolver = "2"

# Dev/test builds skip DWARF debug info. It cost ~119 GB of target/ and a large
# slice of codegen and link time on a ~1550-crate dependency tree, which does not
# fit on this machine's SSD. Panic locations and assert messages still point at the
# right source line (that is compile-time metadata); only backtraces *inside*
# dependency frames lose file:line. Use `debug = "line-tables-only"` if those are
# needed, or `cargo build --profile dev-with-debug` for a one-off gdb session.
[profile.dev]
debug = 0

# Escape hatch for the rare gdb/backtrace session:
#   cargo build --profile dev-with-debug
[profile.dev-with-debug]
inherits = "dev"
debug = 2

# nix 0.31.3 gates `UtunIfname`/`KextControl` on `apple_targets`, which includes
# iOS, but `libc` only defines `SYSPROTO_CONTROL`/`UTUN_OPT_IFNAME` on macOS, so
# `cargo build --target aarch64-apple-ios*` fails inside nix (pulled by
# rtc-shared through webrtc). Upstream fixed the gates on main; this pins that
# commit because 0.31.4 is not on crates.io yet. Drop the patch when it is.
[patch.crates-io]
nix = { git = "https://github.com/nix-rust/nix", rev = "89339c618783622e3cdd8d7a6b17319a65337e94" }
