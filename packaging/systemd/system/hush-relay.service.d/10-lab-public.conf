# Lab VPS override for the shipped hush-relay.service unit.
#
# The shipped unit binds 127.0.0.1:8787 and expects a TLS terminator in front of
# it. This lab box is explicitly NOT hardened (plain HTTP, no TLS, no firewall),
# so the relay must bind a public interface directly. It also cannot use the
# default port: 0.0.0.0:8787 is already owned by mcp-ironlink.service.
#
# Install as:
#   /etc/systemd/system/hush-relay.service.d/10-lab-public.conf
#
# systemd applies the last Environment= assignment for a variable, and drop-ins
# are parsed after the main unit file, so this overrides HUSH_RELAY_ADDR.
[Service]
Environment=HUSH_RELAY_ADDR=0.0.0.0:8790
