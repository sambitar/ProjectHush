[package]
name = "hush-audio"
version = "0.1.0"
edition = "2021"

# Conclave voice's audio glue (Task 23 Phase 2, docs/tasks/conclave-voice.md §8):
# the Opus FFI, the 44.1→48 kHz resampler, and the playout jitter buffer. The
# FFI is the engine-spike's (`crates/voice-spike`) proven surface, promoted —
# the spike recorded what the daemon would own; this is the daemon owning it.

[build-dependencies]
cc = "1"
pkg-config = "0.3"
