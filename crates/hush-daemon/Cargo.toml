[package]
name = "hush-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hush-daemon"
path = "src/main.rs"

[features]
default = ["ethereum"]
# Ethereum + ERC-20 support. On by default because the app offers both chains;
# a Bitcoin-only build turns it off and skips the whole alloy tree.
ethereum = ["hush-wallet/ethereum"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
hex = "0.4"
hush-core = { path = "../hush-core" }
hush-articles = { path = "../hush-articles" }
hush-wallet = { path = "../hush-wallet" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
# Named directly so `main` can install one crypto provider explicitly. rustls
# 0.23 will not choose between two enabled providers, and this binary enables
# both (see the install in `main`). The same line, and the same choice, as the
# desktop shell.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
uuid = { version = "1", features = ["v4"] }

# Reads (HN reader): comment/reader HTML sanitizing, article extraction, cache keys.
ammonia = "4"
scraper = "0.23"
ego-tree = "0.10"
sha2 = "0.10"
url = "2"
feed-rs = "3.0.0"
yrs = "0.28.0"
webrtc = "0.21.1"
# The Sample type the voice plane writes encoded Opus frames with, and the
# transceiver parameter types — the same facade companions the engine spike
# (`crates/voice-spike`) used to prove this stack carries Opus audio.
rtc = "0.21.1"
rtc-media = "0.21.1"
# Conclave voice's codec/resampler/jitter glue (Task 23 Phase 2).
hush-audio = { path = "../hush-audio" }
# Capture and playout for the voice plane: ALSA against the host's PipeWire
# (the spike's probe-proven path; pipewire-rs is the distro-unit follow-up).
cpal = "0.15"
bytes = "1.12.1"
async-trait = "0.1.92"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
hush-relay = { path = "../hush-relay" }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# A real Ed25519 keypair for the zine store tests: a signature that was not
# really made proves nothing, so the fixture signs rather than stands in.
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Verifying an exported article's BIP340 signature under the public identity's
# own key: the whole point of the export is that a relay's check passes, and a
# signature this crate merely produced proves nothing about that.
k256 = { version = "0.13", features = ["schnorr"] }
