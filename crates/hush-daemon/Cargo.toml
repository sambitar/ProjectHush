[package]
name = "hush-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hush-daemon"
path = "src/main.rs"

[features]
default = ["ethereum"]
# Ethereum + ERC-20 support. On by default because the app offers both chains;
# a Bitcoin-only build turns it off and skips the whole alloy tree.
ethereum = ["hush-wallet/ethereum"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
hex = "0.4"
hush-core = { path = "../hush-core" }
hush-wallet = { path = "../hush-wallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
uuid = { version = "1", features = ["v4"] }

# Reads (HN reader): comment/reader HTML sanitizing, article extraction, cache keys.
ammonia = "4"
scraper = "0.23"
ego-tree = "0.10"
sha2 = "0.10"
url = "2"
feed-rs = "3.0.0"
yrs = "0.28.0"
webrtc = "0.21.1"
bytes = "1.12.1"
async-trait = "0.1.92"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
hush-relay = { path = "../hush-relay" }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
