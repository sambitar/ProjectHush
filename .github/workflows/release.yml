# Build the desktop bundles for a release tag and publish them, plus the
# updater manifest, as a draft GitHub Release.
#
# The app is not at the repository root: the frontend lives in apps/hush-tauri
# and the Tauri project in apps/hush-tauri/src-tauri. That path is threaded
# through `projectPath`, the npm steps, and the cache key.
#
# The release is created as a draft on purpose. Nothing reaches an installed
# copy until the draft is published, and publishing is what triggers
# publish-updates.yml, which mirrors the release to the relay that installed
# copies actually read: https://hushrelay.space/updates/latest.json. This
# repository is private, and GitHub 404s unauthenticated release downloads on a
# private repo, so the updater can never be pointed here.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      # One platform failing should not cancel the others: the draft release
      # is assembled from every job, and a half-uploaded manifest is worse than
      # a clearly incomplete one.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # Apple Silicon.
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            # Intel.
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # The AppImage is the only Linux bundle: it is what the updater can
            # replace in place, and it installs fine without a package — a deb
            # in the release would be a dead artifact that never receives an
            # update (the updater does not touch it), so it only invited
            # installs that strand on an old version.
            args: "--bundles appimage"
          # No Windows leg until the daemon has a Windows transport. It listens
          # on `tokio::net::UnixListener`, which does not exist on Windows, so
          # `stage the daemon sidecar` fails with E0433/E0425 and a Windows
          # bundle would carry no daemon for the app to start. Restore this entry
          # — platform windows-latest, target x86_64-pc-windows-msvc, args
          # "--bundles nsis" — once crates/hush-daemon can listen on a named pipe
          # or loopback TCP there. See RELEASING.md, "Platform notes".

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev is deliberately absent: on 22.04 it conflicts
          # with libayatana-appindicator3-dev, and apt refuses the whole list
          # when both are named ("libayatana-appindicator3-dev : Conflicts:
          # libappindicator3-dev"). Ayatana is the maintained fork and the one
          # Tauri v2 documents.
          #
          # libasound2-dev is here for the daemon, not the app: hush-daemon →
          # cpal → alsa → alsa-sys, and without it the build dies in alsa-sys's
          # build script ("The system library `alsa` required by crate
          # `alsa-sys` was not found"). libdbus-1-dev covers the app's GTK stack
          # (tao → dbus → libdbus-sys), which Tauri's own list does not name.
          #
          # libevent-2.1-7 is for the AppImage bundler, which resolves every ELF
          # file it finds in the AppDir — including the bundled Tor — and aborts
          # the whole bundle when one dependency is unresolvable:
          # "ERROR: Could not find dependency: libevent-2.1.so.7". Tor resolves
          # its own copy at runtime through LD_LIBRARY_PATH (see tor.rs), so the
          # library only has to be visible to linuxdeploy at build time.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libdbus-1-dev \
            libevent-2.1-7 \
            protobuf-compiler

      # The app itself does not link hush-core, so it has never needed protoc.
      # The daemon does, through libsignal's build script, and the bundle now
      # carries the daemon — so every leg needs protoc before it builds anything.
      - name: install protoc (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install protobuf

      - name: install protoc (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install protoc --no-progress -y

      - name: setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/hush-tauri/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the macOS runners need a cross target, and only they can build
          # one; the expression keeps the other two legs on the host triple.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: cache Rust
        uses: swatinem/rust-cache@v2
        with:
          # The cargo workspace root is the repository root (apps/hush-tauri is
          # a member), and its target directory is `target`.
          workspaces: ". -> target"
          # The target triple, not matrix.args: args are bundle switches that
          # have carried commas before ("--bundles appimage,deb") and
          # rust-cache rejects any key containing one — "Key Validation Error:
          # ... cannot contain commas" — which left that leg rebuilding
          # libsignal from scratch on every run.
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - name: install frontend dependencies
        working-directory: apps/hush-tauri
        run: npm ci

      # `bundle.externalBin` is what puts the daemon inside the bundle, and
      # `tauri-build` refuses to compile the app without the triple-named file it
      # resolves to, so the daemon is staged before the build rather than beside
      # it. `shell: bash` because the script is bash on every platform; the
      # Windows leg gets the `.exe` suffix from the script, not from here.
      - name: stage the daemon sidecar
        shell: bash
        run: ./scripts/stage-daemon-sidecar.sh --target ${{ matrix.target }} --profile release

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is what makes an update installable: the plugin refuses any
          # artifact whose signature does not match the public key baked into
          # the app. The key itself never enters the repository.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/hush-tauri
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          # The draft is created by the first job to get here; the rest attach
          # their bundles to it. `latest.json` is regenerated from whichever
          # updater artifacts have been uploaded.
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # Prove the bundle is signed, rather than trusting that the config took.
      # v0.2.0 shipped with no Contents/_CodeSignature at all and nothing in this
      # pipeline noticed: the only symptom was a Gatekeeper dialog on a user's Mac
      # ("Hush is damaged and can't be opened"), with no Open button to get past it.
      # `bundle.macOS.signingIdentity` is "-", and `codesign -dv` reports that as
      # "Signature=adhoc". This runs after the upload, so a failure here leaves the
      # assets on a *draft* release, which nobody can install until it is published
      # by hand — a loud failure, and a safe one.
      - name: verify the macOS bundle is signed
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          app="$(find target -type d -name 'Hush.app' -path '*/bundle/macos/*' | head -1)"
          if [[ -z "$app" ]]; then
            echo "no Hush.app under target/; nothing was bundled"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee /tmp/codesign.txt
          if ! grep -q 'Signature=adhoc' /tmp/codesign.txt; then
            echo "the bundle is not ad-hoc signed; a downloaded copy will be refused as damaged"
            exit 1
          fi
          echo "OK: $app carries an ad-hoc signature"
