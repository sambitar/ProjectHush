<svg xmlns="http://www.w3.org/2000/svg" viewBox="33 33 134 134" role="img" aria-labelledby="hush-relay-icon-title">
  <title id="hush-relay-icon-title">Hush Relay (app icon)</title>
  <defs>
    <linearGradient id="hush-relay-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b3a9ff"/>
      <stop offset="52%" stop-color="#8b7df0"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
  </defs>

  <!-- Same paths as hush-relay.svg; the viewBox is tight around the mark so
       it fills an application icon instead of floating in the asset grid. -->

  <!-- Left pillar -->
