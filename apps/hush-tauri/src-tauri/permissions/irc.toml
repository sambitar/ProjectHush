[[permission]]
identifier = "allow-irc"
description = "IRC: multi-server connections, channel and query windows, and non-secret settings"
commands.allow = [
    "connect_server",
    "disconnect_server",
    "join_channel",
    "part_channel",
    "send_message",
    "send_raw",
    "change_nick",
    "open_query",
    "list_channels",
    "get_state",
    "irc_settings_load",
    "irc_settings_save",
]
