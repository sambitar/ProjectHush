[package]
name = "hush-tauri"
version = "0.6.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
url = "2"
base64 = "0.22"
hex = "0.4"
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
bytes = "1"

# In-app updates. The updater fetches the release manifest from GitHub Releases
# and verifies the artifact against the public key in `tauri.conf.json`; the
# process plugin supplies the relaunch that finishes an install. Both are
# registered for desktop only (see `lib.rs`) — the mobile targets have no
# in-app updater, so there is nothing to link there.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "rt", "io-util", "time", "sync", "macros"] }
tower-service = "0.3"

# Signalling a Tor child left behind by a previous run. See `tor::clear_stale`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The chat arrival sound, played natively: the webview's audio path depends on
# the host's GStreamer plugins, which are often incomplete.
rodio = "0.20"

# Native file dialogs. `rfd` has no Android/iOS backend, and the phone build
# reaches the vault through its own commands instead (`src/mobile.rs`), so the
# crate is desktop-only rather than pretending to offer pickers it cannot open.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"

# The vault itself. The desktop shell never links this crate — it talks to
# `hush-daemon` over the Unix socket — but Android has no daemon process, so
# the phone build hosts the account in process (docs/MOBILE_APP_PLAN.md §5.1).
#
# `hush-voice` comes along for the same reason: conclave voice's media plane
# (webrtc-rs + cpal) lives in the daemon on desktop and in this process on the
# phone. Neither is a dependency of the desktop build.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
hush-core = { path = "../../../crates/hush-core" }
hush-voice = { path = "../../../crates/hush-voice" }
uuid = { version = "1", features = ["v4"] }

[lib]
name = "hush_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
axum = "0.8"
# The phone backend is host-testable: these make its vault lifecycle
# (create/unlock/status/lock) provable without an emulator.
hush-core = { path = "../../../crates/hush-core" }
hush-voice = { path = "../../../crates/hush-voice" }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
