[package]
name = "hush-tauri"
version = "0.1.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }

[lib]
name = "hush_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
