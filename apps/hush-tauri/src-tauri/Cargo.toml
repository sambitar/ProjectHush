[package]
name = "hush-tauri"
version = "0.4.0"
edition = "2021"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
url = "2"
rfd = "0.15"
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
bytes = "1"

# In-app updates. The updater fetches the release manifest from GitHub Releases
# and verifies the artifact against the public key in `tauri.conf.json`; the
# process plugin supplies the relaunch that finishes an install. Both are
# registered for desktop only (see `lib.rs`) — the mobile targets have no
# in-app updater, so there is nothing to link there.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["net", "rt", "io-util", "time", "sync", "macros"] }
tower-service = "0.3"

# The IRC client. TLS is mandatory for the default servers, so the rustls stack
# is a hard dependency; the `ring` provider is used explicitly (see `irc::tls`)
# so the build never depends on the workspace's other rustls consumers.
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
base64 = "0.22"
rand = "0.8"

# The Libera client certificate (SASL EXTERNAL). `rcgen` mints the self-signed
# certificate on the device; `ring` is named explicitly so the key generation
# goes through the same provider as the TLS stack above rather than dragging in
# a second crypto backend. `sha2` computes the SHA-512 fingerprint NickServ
# matches on.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.11"

# Signalling a Tor child left behind by a previous run. See `tor::clear_stale`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The chat arrival sound, played natively: the webview's audio path depends on
# the host's GStreamer plugins, which are often incomplete.
rodio = "0.20"

[lib]
name = "hush_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
# Used by the IRC onion-address test, which decodes the base32 name and checks
# the v3 checksum. Both are already in the dependency graph (alloy pulls them
# in), so this adds no build cost.
data-encoding = "2"
sha3 = "0.11"
