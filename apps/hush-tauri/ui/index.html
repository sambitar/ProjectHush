<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hush</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0f1419;
        color: #e7ecf3;
      }
      body {
        margin: 0;
        padding: 1.25rem;
        max-width: 52rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.25rem;
      }
      .muted {
        color: #8b98a8;
        font-size: 0.875rem;
      }
      section {
        margin-top: 1.25rem;
        padding: 1rem;
        border: 1px solid #2a3441;
        border-radius: 8px;
        background: #151b23;
      }
      label {
        display: block;
        font-size: 0.8rem;
        color: #8b98a8;
        margin-bottom: 0.25rem;
      }
      input,
      textarea,
      button,
      select {
        font: inherit;
        border-radius: 6px;
        border: 1px solid #3a4654;
        background: #0f1419;
        color: inherit;
        padding: 0.5rem 0.65rem;
        width: 100%;
        box-sizing: border-box;
      }
      button {
        cursor: pointer;
        width: auto;
        background: #2d6cdf;
        border-color: #2d6cdf;
        margin-top: 0.5rem;
      }
      button.secondary {
        background: #2a3441;
        border-color: #3a4654;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        align-items: end;
      }
      .row > * {
        flex: 1;
        min-width: 8rem;
      }
      #log {
        white-space: pre-wrap;
        font-size: 0.85rem;
        min-height: 8rem;
        max-height: 14rem;
        overflow: auto;
        background: #0b0f14;
        padding: 0.75rem;
        border-radius: 6px;
        border: 1px solid #2a3441;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Hush</h1>
    <p class="muted" id="status">Checking daemon…</p>

    <section id="unlock-panel">
      <label for="pass">Passphrase</label>
      <input id="pass" type="password" autocomplete="current-password" />
      <button type="button" id="unlock-btn">Unlock vault</button>
    </section>

    <section id="app-panel" class="hidden">
      <p class="muted" id="vault-meta"></p>
      <div class="row">
        <div>
          <label for="contact-nick">Add contact nickname</label>
          <input id="contact-nick" placeholder="alice" />
        </div>
        <div>
          <label for="contact-invite">Invite string</label>
          <input id="contact-invite" placeholder="paste invite" />
        </div>
      </div>
      <button type="button" id="add-contact-btn" class="secondary">Add contact</button>
      <button type="button" id="invite-btn" class="secondary">Copy my invite</button>

      <div class="row" style="margin-top: 1rem">
        <div>
          <label for="to">Send to</label>
          <select id="to"></select>
        </div>
        <div>
          <label for="msg">Message</label>
          <input id="msg" />
        </div>
      </div>
      <button type="button" id="send-btn">Send</button>

      <div class="row" style="margin-top: 1rem">
        <div>
          <label for="file-path">Send file (path on this machine)</label>
          <input id="file-path" placeholder="/home/you/file.txt" />
        </div>
      </div>
      <button type="button" id="send-file-btn" class="secondary">Send file</button>
      <button type="button" id="recv-btn" class="secondary">Check inbox</button>
      <button type="button" id="lock-btn" class="secondary">Lock</button>

      <h2 style="font-size: 1rem; margin: 1rem 0 0.5rem">Inbox</h2>
      <div id="log"></div>
    </section>

    <script>
      const API = "http://127.0.0.1:9876";
      const statusEl = document.getElementById("status");
      const unlockPanel = document.getElementById("unlock-panel");
      const appPanel = document.getElementById("app-panel");
      const vaultMeta = document.getElementById("vault-meta");
      const logEl = document.getElementById("log");
      const toSelect = document.getElementById("to");

      async function api(path, opts = {}) {
        const res = await fetch(API + path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        if (!res.ok) throw new Error(path + " " + res.status);
        if (res.status === 204) return null;
        return res.json();
      }

      function log(line) {
        logEl.textContent += line + "\n";
      }

      async function refreshStatus() {
        const s = await api("/api/status");
        if (s.locked) {
          statusEl.textContent = "Locked · " + s.vault_dir;
          unlockPanel.classList.remove("hidden");
          appPanel.classList.add("hidden");
        } else {
          statusEl.textContent = "Unlocked";
          unlockPanel.classList.add("hidden");
          appPanel.classList.remove("hidden");
          vaultMeta.textContent =
            s.vault_dir +
            " · " +
            (s.protocol_name || "") +
            " · " +
            formatBytes(s.vault_bytes) +
            " on disk · " +
            s.contacts +
            " contacts";
          await loadContacts();
        }
      }

      function formatBytes(n) {
        if (n < 1024) return n + " B";
        return (n / 1024).toFixed(1) + " KiB";
      }

      async function loadContacts() {
        const list = await api("/api/contacts");
        toSelect.innerHTML = "";
        for (const c of list) {
          const o = document.createElement("option");
          o.value = c.nickname;
          o.textContent = c.nickname;
          toSelect.appendChild(o);
        }
      }

      document.getElementById("unlock-btn").onclick = async () => {
        try {
          await api("/api/unlock", {
            method: "POST",
            body: JSON.stringify({ passphrase: document.getElementById("pass").value }),
          });
          await refreshStatus();
        } catch (e) {
          statusEl.textContent = "Unlock failed";
        }
      };

      document.getElementById("lock-btn").onclick = async () => {
        await api("/api/lock", { method: "POST" });
        await refreshStatus();
      };

      document.getElementById("invite-btn").onclick = async () => {
        const r = await api("/api/invite", { method: "POST" });
        await navigator.clipboard.writeText(r.invite);
        log("Invite copied to clipboard.");
      };

      document.getElementById("add-contact-btn").onclick = async () => {
        await api("/api/contacts/add", {
          method: "POST",
          body: JSON.stringify({
            nickname: document.getElementById("contact-nick").value,
            invite: document.getElementById("contact-invite").value.trim(),
          }),
        });
        await refreshStatus();
        log("Contact added.");
      };

      document.getElementById("send-btn").onclick = async () => {
        await api("/api/send", {
          method: "POST",
          body: JSON.stringify({
            to: toSelect.value,
            text: document.getElementById("msg").value,
          }),
        });
        document.getElementById("msg").value = "";
        log("Sent to " + toSelect.value);
      };

      document.getElementById("send-file-btn").onclick = async () => {
        await api("/api/send-file", {
          method: "POST",
          body: JSON.stringify({
            to: toSelect.value,
            path: document.getElementById("file-path").value,
          }),
        });
        log("File sent to " + toSelect.value);
      };

      document.getElementById("recv-btn").onclick = async () => {
        const msgs = await api("/api/recv", { method: "POST" });
        for (const m of msgs) {
          if (m.kind === "text") log(m.from + ": " + m.text);
          else log(m.from + ": file " + m.file_name + " → " + m.saved_path);
        }
        if (!msgs.length) log("(no new messages)");
      };

      refreshStatus().catch(() => {
        statusEl.textContent =
          "Daemon not running. Start: hush-daemon --dir /path/to/vault";
      });
    </script>
  </body>
</html>
